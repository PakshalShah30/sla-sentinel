<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SLA Sentinel</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --border: #dfe3e8;
    --text-primary: #1a1f26;
    --text-secondary: #5c6570;
    --text-muted: #8a929c;
    --green-bg: #eaf6ee;
    --green-text: #1e7a3d;
    --green-border: #bfe4cb;
    --amber-bg: #fdf4e3;
    --amber-text: #99640a;
    --amber-border: #f2ddab;
    --red-bg: #fbe9e9;
    --red-text: #a52a2a;
    --red-border: #f2c4c4;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  header h1 {
    font-size: 18px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }

  header .subtitle {
    color: var(--text-secondary);
    font-size: 13px;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  select {
    font-size: 13px;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text-primary);
  }

  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 24px 32px 64px;
  }

  .section-title {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-secondary);
    margin: 28px 0 12px;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
  }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .card-top h3 {
    margin: 0 0 2px;
    font-size: 15px;
    font-weight: 600;
  }

  .card-top .url {
    color: var(--text-muted);
    font-size: 12px;
    word-break: break-all;
  }

  .status-pill {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 3px 10px;
    border-radius: 999px;
    white-space: nowrap;
    border: 1px solid transparent;
  }

  .status-green { background: var(--green-bg); color: var(--green-text); border-color: var(--green-border); }
  .status-amber { background: var(--amber-bg); color: var(--amber-text); border-color: var(--amber-border); }
  .status-red   { background: var(--red-bg);   color: var(--red-text);   border-color: var(--red-border); }

  .metrics-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 14px;
  }

  .metric {
    background: var(--bg);
    border-radius: 8px;
    padding: 8px 10px;
  }

  .metric .label {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 2px;
  }

  .metric .value {
    font-size: 16px;
    font-weight: 600;
  }

  .metric.breach .value { color: var(--red-text); }

  .sla-line {
    font-size: 11.5px;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  .chart-wrap {
    height: 90px;
    position: relative;
  }

  table.breaches {
    width: 100%;
    border-collapse: collapse;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    font-size: 13px;
  }

  table.breaches th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-muted);
    font-weight: 600;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
  }

  table.breaches td {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }

  table.breaches tr:last-child td { border-bottom: none; }

  .metric-tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 1px 8px;
    border-radius: 999px;
    background: var(--red-bg);
    color: var(--red-text);
  }

  .empty-state {
    color: var(--text-muted);
    padding: 24px;
    text-align: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
  }

  footer {
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    padding: 24px;
  }

  footer a { color: var(--text-secondary); }
</style>
</head>
<body>

<header>
  <div>
    <h1>SLA Sentinel</h1>
    <div class="subtitle">Integration SLA monitoring and breach alerting</div>
  </div>
  <div class="header-right">
    <label for="window-select" class="subtitle">Window</label>
    <select id="window-select">
      <option value="1h">1 hour</option>
      <option value="6h">6 hours</option>
      <option value="24h" selected>24 hours</option>
      <option value="7d">7 days</option>
    </select>
  </div>
</header>

<main>
  <div class="section-title">Integrations</div>
  <div class="cards" id="cards"></div>

  <div class="section-title">Recent breaches</div>
  <div id="breaches-container"></div>
</main>

<footer>
  SLA Sentinel &middot; <a href="https://pakshalshah.com" target="_blank" rel="noopener">Pakshal Shah</a>
</footer>

<script>
const charts = {};

function statusClass(status) {
  return "status-" + status;
}

function fmtNum(v, digits) {
  if (v === null || v === undefined) return "-";
  return Number(v).toFixed(digits);
}

function fmtTs(ts) {
  const d = new Date(ts);
  if (isNaN(d.getTime())) return ts;
  return d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
}

function metricBreaches(integ) {
  const m = integ.metrics;
  const s = integ.sla;
  const flags = {};
  flags.uptime_pct = m.uptime_pct !== null && m.uptime_pct < s.uptime_pct;
  flags.p95_latency_ms = m.p95_latency_ms !== null && m.p95_latency_ms > s.p95_latency_ms;
  flags.error_rate_pct = m.error_rate_pct !== null && m.error_rate_pct > s.error_rate_pct;
  return flags;
}

function renderCard(integ) {
  const m = integ.metrics;
  const flags = metricBreaches(integ);

  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div class="card-top">
      <div>
        <h3>${integ.name}</h3>
        <div class="url">${integ.method} ${integ.url}</div>
      </div>
      <span class="status-pill ${statusClass(integ.status)}">${integ.status}</span>
    </div>
    <div class="metrics-row">
      <div class="metric ${flags.uptime_pct ? "breach" : ""}">
        <div class="label">Uptime</div>
        <div class="value">${fmtNum(m.uptime_pct, 2)}%</div>
      </div>
      <div class="metric ${flags.p95_latency_ms ? "breach" : ""}">
        <div class="label">p95 latency</div>
        <div class="value">${m.p95_latency_ms === null ? "-" : Math.round(m.p95_latency_ms) + "ms"}</div>
      </div>
      <div class="metric ${flags.error_rate_pct ? "breach" : ""}">
        <div class="label">Error rate</div>
        <div class="value">${fmtNum(m.error_rate_pct, 2)}%</div>
      </div>
    </div>
    <div class="sla-line">
      SLA: uptime &ge; ${integ.sla.uptime_pct}% &middot; p95 &le; ${integ.sla.p95_latency_ms}ms
      &middot; errors &le; ${integ.sla.error_rate_pct}% &middot; ${m.total_probes} probes in window
    </div>
    <div class="chart-wrap">
      <canvas id="chart-${cssSafe(integ.name)}"></canvas>
    </div>
  `;
  return card;
}

function cssSafe(name) {
  return name.replace(/[^a-zA-Z0-9]/g, "-");
}

function renderChart(integ) {
  const canvasId = "chart-" + cssSafe(integ.name);
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;

  const series = integ.latency_series || [];
  const labels = series.map(p => p.ts);
  const data = series.map(p => p.latency_ms);

  if (charts[integ.name]) {
    charts[integ.name].destroy();
  }

  charts[integ.name] = new Chart(canvas.getContext("2d"), {
    type: "line",
    data: {
      labels: labels,
      datasets: [{
        data: data,
        borderColor: integ.status === "red" ? "#a52a2a" : (integ.status === "amber" ? "#99640a" : "#1e7a3d"),
        borderWidth: 1.5,
        pointRadius: 0,
        tension: 0.15,
        spanGaps: true,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      plugins: { legend: { display: false }, tooltip: { enabled: true } },
      scales: {
        x: { display: false },
        y: { display: true, ticks: { font: { size: 10 }, maxTicksLimit: 3 }, grid: { color: "#eef0f2" } }
      }
    }
  });
}

function renderBreaches(breaches) {
  const container = document.getElementById("breaches-container");
  if (!breaches.length) {
    container.innerHTML = '<div class="empty-state">No breaches recorded yet.</div>';
    return;
  }
  const rows = breaches.map(b => `
    <tr>
      <td>${fmtTs(b.ts)}</td>
      <td>${b.integration}</td>
      <td><span class="metric-tag">${b.metric}</span></td>
      <td>${b.threshold}</td>
      <td>${b.actual}</td>
      <td>${b.message}</td>
    </tr>
  `).join("");
  container.innerHTML = `
    <table class="breaches">
      <thead>
        <tr><th>Time</th><th>Integration</th><th>Metric</th><th>Threshold</th><th>Actual</th><th>Detail</th></tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

async function loadDashboard() {
  const window_ = document.getElementById("window-select").value;
  const [metricsResp, breachesResp] = await Promise.all([
    fetch(`/api/metrics?window=${window_}`).then(r => r.json()),
    fetch(`/api/breaches?limit=25`).then(r => r.json()),
  ]);

  const cardsEl = document.getElementById("cards");
  cardsEl.innerHTML = "";
  metricsResp.integrations.forEach(integ => {
    cardsEl.appendChild(renderCard(integ));
  });
  metricsResp.integrations.forEach(integ => renderChart(integ));

  renderBreaches(breachesResp);
}

document.getElementById("window-select").addEventListener("change", loadDashboard);
loadDashboard();
setInterval(loadDashboard, 30000);
</script>

</body>
</html>
